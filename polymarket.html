<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poly Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f2f2f7;
    --bg2:       #ffffff;
    --bg3:       #f8f8fb;
    --border:    rgba(0,0,0,0.08);
    --border2:   rgba(0,0,0,0.12);
    --text:      #1c1c1e;
    --text2:     #3a3a3c;
    --text3:     #8e8e93;
    --text4:     #aeaeb2;
    --accent:    #007aff;
    --accent-bg: rgba(0,122,255,0.08);
    --yes:       #34c759;
    --yes-bg:    rgba(52,199,89,0.1);
    --no:        #ff3b30;
    --no-bg:     rgba(255,59,48,0.1);
    --warn:      #ff9500;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
    --radius:    14px;
    --radius-sm: 10px;
    --radius-xs: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(242,242,247,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
    white-space: nowrap;
  }

  .logo .dot { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .header-stat {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  .header-stat-label {
    font-size: 10px;
    color: var(--text3);
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .header-stat-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: var(--yes-bg);
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    color: var(--yes);
    letter-spacing: 0.3px;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--yes);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Layout ── */
  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 20px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 16px;
    align-items: start;
  }

  /* ── Cards ── */
  .card {
    background: var(--bg2);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 18px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    letter-spacing: 0.1px;
    text-transform: uppercase;
  }

  .card-action {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
  }

  /* ── Segment control ── */
  .segment-wrap {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .segment {
    display: flex;
    background: rgba(118,118,128,0.12);
    border-radius: var(--radius-xs);
    padding: 2px;
    gap: 2px;
  }

  .seg-btn {
    flex: 1;
    padding: 6px 8px;
    background: transparent;
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--text3);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .seg-btn.active {
    background: var(--bg2);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    font-weight: 600;
  }

  /* ── Market list ── */
  .market-list { }

  .market-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  .market-item:last-child { border-bottom: none; }
  .market-item:hover { background: var(--bg3); }
  .market-item.selected { background: var(--accent-bg); }
  .market-item.selected::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }

  .market-rank {
    width: 24px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text4);
    text-align: center;
    flex-shrink: 0;
  }

  .market-body { flex: 1; min-width: 0; }

  .market-q {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 6px;
  }

  .market-footer {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ── Progress bar ── */
  .prob-bar {
    flex: 1;
    height: 5px;
    background: var(--no-bg);
    border-radius: 3px;
    overflow: hidden;
  }

  .prob-fill {
    height: 100%;
    background: var(--yes);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .prob-yes {
    font-size: 12px;
    font-weight: 700;
    color: var(--yes);
    min-width: 34px;
  }

  .prob-no {
    font-size: 11px;
    color: var(--no);
    min-width: 28px;
    text-align: right;
  }

  .vol-tag {
    font-size: 11px;
    color: var(--text4);
    white-space: nowrap;
  }

  .date-tag {
    font-size: 11px;
    color: var(--text4);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
  }

  /* ── Right col ── */
  .right-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 68px;
  }

  /* ── Portfolio card ── */
  .portfolio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }

  .portfolio-cell {
    background: var(--bg2);
    padding: 16px 18px;
  }

  .portfolio-label {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    margin-bottom: 4px;
    letter-spacing: 0.2px;
  }

  .portfolio-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .portfolio-value.green { color: var(--yes); }
  .portfolio-value.red   { color: var(--no); }

  /* ── Trade form ── */
  .market-preview {
    margin: 16px 18px 0;
    padding: 12px 14px;
    background: var(--bg3);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }

  .preview-hint {
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    padding: 4px 0;
  }

  .preview-q {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .preview-prices {
    display: flex;
    gap: 8px;
  }

  .price-pill {
    flex: 1;
    padding: 6px 10px;
    border-radius: var(--radius-xs);
    text-align: center;
    font-size: 12px;
    font-weight: 600;
  }

  .price-pill.yes-pill { background: var(--yes-bg); color: var(--yes); }
  .price-pill.no-pill  { background: var(--no-bg);  color: var(--no); }

  /* ── Side selector ── */
  .side-row {
    display: flex;
    gap: 8px;
    padding: 14px 18px 0;
  }

  .side-btn {
    flex: 1;
    padding: 11px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border2);
    background: var(--bg2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.2px;
  }

  .side-btn.yes { color: var(--yes); }
  .side-btn.yes.active {
    background: var(--yes-bg);
    border-color: var(--yes);
  }

  .side-btn.no { color: var(--no); }
  .side-btn.no.active {
    background: var(--no-bg);
    border-color: var(--no);
  }

  /* ── Amount input ── */
  .amount-row {
    padding: 12px 18px 0;
  }

  .amount-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text3);
    margin-bottom: 8px;
  }

  .amount-input-wrap {
    display: flex;
    align-items: center;
    background: var(--bg3);
    border: 1.5px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 0 14px;
    transition: border-color 0.2s;
  }

  .amount-input-wrap:focus-within {
    border-color: var(--accent);
    background: var(--bg2);
  }

  .amount-input-wrap input {
    flex: 1;
    padding: 11px 0;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    outline: none;
  }

  .amount-unit {
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
  }

  .shares-hint {
    font-size: 11px;
    color: var(--text4);
    margin-top: 6px;
  }

  /* ── Execute btn ── */
  .exec-row { padding: 14px 18px 18px; }

  .exec-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.1px;
  }

  .exec-btn:hover:not(:disabled) { background: #0066dd; }
  .exec-btn:active:not(:disabled) { transform: scale(0.98); }

  .exec-btn:disabled {
    background: rgba(0,122,255,0.3);
    cursor: not-allowed;
  }

  /* ── Positions ── */
  .pos-list { padding: 4px 0; }

  .pos-item {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .pos-item:last-child { border-bottom: none; }

  .pos-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .pos-q {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.4;
  }

  .pos-pnl {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pos-pnl.up { color: var(--yes); }
  .pos-pnl.dn { color: var(--no); }

  .pos-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pos-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .pos-chip.yes { background: var(--yes-bg); color: var(--yes); }
  .pos-chip.no  { background: var(--no-bg);  color: var(--no); }

  .pos-detail {
    font-size: 11px;
    color: var(--text3);
  }

  .empty-pos {
    padding: 32px 18px;
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    line-height: 2;
  }

  .empty-pos .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  /* ── Loading ── */
  .list-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 40px;
    color: var(--text3);
    font-size: 13px;
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(28,28,30,0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #fff;
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 768px) {
    .page { grid-template-columns: 1fr; }
    .right-col { position: static; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">Poly<span class="dot">·</span>Monitor</div>
  <div class="header-right">
    <div class="header-stat" style="display:none" id="h-stat">
      <span class="header-stat-label">Markets</span>
      <span class="header-stat-value" id="h-count">—</span>
    </div>
    <div class="header-stat">
      <span class="header-stat-label">Balance</span>
      <span class="header-stat-value" id="h-balance">$1,000</span>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </div>
</header>

<!-- PAGE -->
<div class="page">

  <!-- LEFT: Market list -->
  <div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Markets</span>
        <span style="font-size:11px;color:var(--text4)" id="update-time">—</span>
      </div>
      <div class="segment-wrap">
        <div class="segment">
          <button class="seg-btn active" onclick="setFilter('all',this)">All</button>
          <button class="seg-btn" onclick="setFilter('politics',this)">Politics</button>
          <button class="seg-btn" onclick="setFilter('crypto',this)">Crypto</button>
          <button class="seg-btn" onclick="setFilter('sports',this)">Sports</button>
          <button class="seg-btn" onclick="setFilter('science',this)">Tech</button>
        </div>
      </div>
      <div class="market-list" id="market-list">
        <div class="list-loading"><div class="spinner"></div>Loading markets…</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Trade panel + Positions -->
  <div class="right-col">

    <!-- Portfolio -->
    <div class="card">
      <div class="portfolio-grid">
        <div class="portfolio-cell">
          <div class="portfolio-label">Available</div>
          <div class="portfolio-value" id="p-balance">$1,000</div>
        </div>
        <div class="portfolio-cell">
          <div class="portfolio-label">Unrealized P&L</div>
          <div class="portfolio-value" id="p-pnl">$0.00</div>
        </div>
      </div>
    </div>

    <!-- Trade form -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Paper Trade</span>
      </div>

      <!-- Market preview -->
      <div class="market-preview" id="market-preview">
        <p class="preview-hint">← Select a market</p>
      </div>

      <!-- Side -->
      <div class="side-row">
        <button class="side-btn yes" id="btn-yes" onclick="setSide('YES')">YES ↑</button>
        <button class="side-btn no"  id="btn-no"  onclick="setSide('NO')">NO ↓</button>
      </div>

      <!-- Amount -->
      <div class="amount-row">
        <div class="amount-label">Amount</div>
        <div class="amount-input-wrap">
          <input type="number" id="amount-input" value="50" min="1" placeholder="50" oninput="updatePreview()">
          <span class="amount-unit">USDC</span>
        </div>
        <div class="shares-hint" id="shares-hint">Select a market first</div>
      </div>

      <!-- Execute -->
      <div class="exec-row">
        <button class="exec-btn" id="exec-btn" onclick="executeTrade()" disabled>
          Place Order
        </button>
      </div>
    </div>

    <!-- Positions -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Positions</span>
        <button class="card-action" onclick="resetPortfolio()">Reset</button>
      </div>
      <div id="pos-list">
        <div class="empty-pos">
          <div class="icon">📊</div>
          No open positions yet.<br>Select a market to start.
        </div>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let state = JSON.parse(localStorage.getItem('poly_ios_state') || JSON.stringify({
  balance: 1000, positions: {}, trades: []
}));
let allMarkets = [], filteredMarkets = [];
let selectedMarket = null, selectedSide = null;
let currentFilter = 'all';

const GAMMA = 'https://gamma-api.polymarket.com';

function save() {
  localStorage.setItem('poly_ios_state', JSON.stringify(state));
  renderPortfolio();
  renderPositions();
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchMarkets() {
  try {
    const r = await fetch(`${GAMMA}/markets?limit=50&order=volume24hr&ascending=false&active=true`);
    if (!r.ok) throw new Error();
    allMarkets = await r.json();
    document.getElementById('h-count').textContent = allMarkets.length;
    document.getElementById('h-stat').style.display = 'flex';
    document.getElementById('update-time').textContent = 'Updated ' + new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'});
    applyFilter();
    renderPortfolio(); // refresh pnl with latest prices
  } catch {
    document.getElementById('market-list').innerHTML =
      '<div class="list-loading" style="color:var(--no)">⚠ Failed to load. Retrying…</div>';
  }
}

// ── Filter ──────────────────────────���─────────────────────────────────────────
const TAGS = {
  politics: ['politics','elections','trump','biden','government','geopolitics','iran','war'],
  crypto:   ['crypto','bitcoin','btc','ethereum','eth','defi','blockchain'],
  sports:   ['nba','nfl','soccer','football','baseball','tennis','sports'],
  science:  ['ai','tech','science','space','health','openai','gpt','climate']
};

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
}

function applyFilter() {
  if (currentFilter === 'all') {
    filteredMarkets = allMarkets;
  } else {
    const tags = TAGS[currentFilter] || [];
    filteredMarkets = allMarkets.filter(m => {
      const q = (m.question || '').toLowerCase();
      return tags.some(t => q.includes(t));
    });
    if (!filteredMarkets.length) filteredMarkets = allMarkets.slice(0, 20);
  }
  renderList();
}

// ── Render list ───────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('market-list');
  if (!filteredMarkets.length) {
    el.innerHTML = '<div class="list-loading" style="color:var(--text3)">No markets found</div>';
    return;
  }
  el.innerHTML = filteredMarkets.slice(0,30).map((m, i) => {
    const prices = parsePrices(m.outcomePrices);
    const yes = prices[0] ?? 0.5;
    const no  = prices[1] ?? (1 - yes);
    const vol = parseFloat(m.volume || 0);
    const end = m.endDate ? m.endDate.slice(0,10) : '';
    const mid = selectedMarket && (selectedMarket.conditionId || selectedMarket.id) === (m.conditionId || m.id);

    return `
    <div class="market-item ${mid?'selected':''}" onclick="selectMarket(${i})">
      <div class="market-rank">${i+1}</div>
      <div class="market-body">
        <div class="market-q">${m.question || '—'}</div>
        <div class="market-footer">
          <span class="prob-yes">${(yes*100).toFixed(0)}%</span>
          <div class="prob-bar"><div class="prob-fill" style="width:${yes*100}%"></div></div>
          <span class="prob-no">${(no*100).toFixed(0)}%</span>
          <span class="vol-tag">${vol>1e6?'$'+(vol/1e6).toFixed(1)+'M':vol>1e3?'$'+(vol/1e3).toFixed(0)+'K':''}</span>
          ${end?`<span class="date-tag">· ${end}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Select ────────────────────────────────────────────────────────────────────
function selectMarket(i) {
  selectedMarket = filteredMarkets[i];
  selectedSide = null;
  document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('exec-btn').disabled = true;

  const prices = parsePrices(selectedMarket.outcomePrices);
  const yes = prices[0] ?? 0.5;
  const no  = prices[1] ?? (1 - yes);

  document.getElementById('market-preview').innerHTML = `
    <div class="preview-q">${selectedMarket.question}</div>
    <div class="preview-prices">
      <div class="price-pill yes-pill">YES &nbsp;<strong>${(yes*100).toFixed(1)}%</strong></div>
      <div class="price-pill no-pill">NO &nbsp;<strong>${(no*100).toFixed(1)}%</strong></div>
    </div>`;

  renderList();
  updatePreview();
}

function setSide(s) {
  if (!selectedMarket) { showToast('Select a market first'); return; }
  selectedSide = s;
  document.getElementById('btn-yes').classList.toggle('active', s === 'YES');
  document.getElementById('btn-no').classList.toggle('active', s === 'NO');
  document.getElementById('exec-btn').disabled = false;
  updatePreview();
}

function updatePreview() {
  if (!selectedMarket || !selectedSide) return;
  const prices = parsePrices(selectedMarket.outcomePrices);
  const price = selectedSide === 'YES' ? (prices[0] ?? 0.5) : (prices[1] ?? 0.5);
  const amount = parseFloat(document.getElementById('amount-input').value) || 0;
  const shares = price > 0 ? (amount / price).toFixed(2) : '—';
  document.getElementById('shares-hint').textContent =
    `≈ ${shares} shares at ${(price*100).toFixed(1)}¢ each`;
}

// ── Execute ───────────────────────────────────────────────────────────────────
function executeTrade() {
  if (!selectedMarket || !selectedSide) return;
  const amount = parseFloat(document.getElementById('amount-input').value);
  if (!amount || amount <= 0) { showToast('Enter an amount'); return; }
  if (amount > state.balance) { showToast('Insufficient balance'); return; }

  const prices = parsePrices(selectedMarket.outcomePrices);
  const price = selectedSide === 'YES' ? (prices[0] ?? 0.5) : (prices[1] ?? 0.5);
  const quantity = amount / price;
  const mid = selectedMarket.conditionId || selectedMarket.id;

  state.balance -= amount;

  if (!state.positions[mid]) {
    state.positions[mid] = {
      question: selectedMarket.question, side: selectedSide,
      entry_price: price, quantity, invested: amount,
      time: new Date().toISOString()
    };
  } else {
    const p = state.positions[mid];
    const nq = p.quantity + quantity;
    const ni = p.invested + amount;
    p.entry_price = ni / nq; p.quantity = nq; p.invested = ni;
  }

  state.trades.push({ market: selectedMarket.question, side: selectedSide, price, quantity, amount, time: new Date().toISOString() });
  save();
  renderList();
  showToast(`✓ ${selectedSide} ${quantity.toFixed(1)} shares @ ${(price*100).toFixed(0)}¢`);
}

// ── Portfolio ─────────────────────────────────────────────────────────────────
function renderPortfolio() {
  document.getElementById('p-balance').textContent = '$' + state.balance.toFixed(2);
  document.getElementById('h-balance').textContent = '$' + Math.round(state.balance).toLocaleString();

  let totalPnl = 0;
  Object.entries(state.positions).forEach(([id, pos]) => {
    const m = allMarkets.find(x => (x.conditionId || x.id) === id);
    if (!m) return;
    const prices = parsePrices(m.outcomePrices);
    const cur = pos.side === 'YES' ? prices[0] : prices[1];
    if (!cur) return;
    totalPnl += pos.side === 'YES'
      ? (cur - pos.entry_price) * pos.quantity
      : (pos.entry_price - cur) * pos.quantity;
  });

  const el = document.getElementById('p-pnl');
  el.textContent = (totalPnl >= 0 ? '+$' : '-$') + Math.abs(totalPnl).toFixed(2);
  el.className = 'portfolio-value ' + (totalPnl > 0 ? 'green' : totalPnl < 0 ? 'red' : '');
}

// ── Positions ─────────────────────────────────────────────────────────────────
function renderPositions() {
  const entries = Object.entries(state.positions);
  const el = document.getElementById('pos-list');
  if (!entries.length) {
    el.innerHTML = '<div class="empty-pos"><div class="icon">📊</div>No open positions yet.<br>Select a market to start.</div>';
    return;
  }

  el.innerHTML = '<div class="pos-list">' + entries.map(([id, pos]) => {
    const m = allMarkets.find(x => (x.conditionId || x.id) === id);
    let pnl = 0, pnlStr = '—';
    if (m) {
      const prices = parsePrices(m.outcomePrices);
      const cur = pos.side === 'YES' ? prices[0] : prices[1];
      if (cur) {
        pnl = pos.side === 'YES'
          ? (cur - pos.entry_price) * pos.quantity
          : (pos.entry_price - cur) * pos.quantity;
        pnlStr = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
      }
    }
    return `
    <div class="pos-item">
      <div class="pos-top">
        <div class="pos-q">${pos.question}</div>
        <div class="pos-pnl ${pnl>=0?'up':'dn'}">${pnlStr}</div>
      </div>
      <div class="pos-meta">
        <span class="pos-chip ${pos.side.toLowerCase()}">${pos.side}</span>
        <span class="pos-detail">Entry ${(pos.entry_price*100).toFixed(1)}¢</span>
        <span class="pos-detail">${pos.quantity.toFixed(1)} shares</span>
        <span class="pos-detail">Cost $${pos.invested.toFixed(2)}</span>
      </div>
    </div>`;
  }).join('') + '</div>';
}

// ── Reset ──────────────────────────────────────────────────��───────────────────
function resetPortfolio() {
  if (!confirm('Reset all positions and restore $1,000?')) return;
  state = { balance: 1000, positions: {}, trades: [] };
  save(); renderList(); showToast('Portfolio reset');
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function parsePrices(raw) {
  if (!raw) return [];
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch { return []; } }
  return Array.isArray(raw) ? raw.map(Number) : [];
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderPortfolio();
renderPositions();
fetchMarkets();
setInterval(fetchMarkets, 60000);
</script>
</body>
